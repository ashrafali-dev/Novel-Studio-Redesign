plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.ashraf.novelstudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ashraf.novelstudio'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0-gecko'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    // Use a published stable build from the GeckoView ESR 140 line.
    implementation 'org.mozilla.geckoview:geckoview-stable:140.+'
}
