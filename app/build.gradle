plugins { id 'com.android.application' }
android {
 namespace 'com.ashraf.novelstudio'
 compileSdk 37
 defaultConfig { applicationId 'com.ashraf.novelstudio'; minSdk 23; targetSdk 35; versionCode 2; versionName '2.1.0-webview' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 buildTypes { release { minifyEnabled false } }
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
configurations.configureEach { resolutionStrategy.eachDependency { d -> if(d.requested.group=='org.jetbrains.kotlin'){d.useVersion('2.2.10');d.because('AGP 9.1 built-in Kotlin compiler compatibility')} } }
dependencies { implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10' }
